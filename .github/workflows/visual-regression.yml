name: Visual regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'public/**'
      - 'package*.json'
      - 'vite.config.js'
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://vtrtyzbgpsvqwbfoudaf.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/visual.spec.ts --project=chromium
      - name: Evidencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
