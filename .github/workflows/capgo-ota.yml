name: PUENTE ÚNICO Capgo → OTA libre (1.55.145)

# Sube automáticamente un bundle OTA a Capgo al canal "beta" (app com.cco.wms)
# en cada push a main, SOLO cuando cambia la versión de package.json (Capgo rechaza
# versiones duplicadas). SOLO los PDA asignados al canal "beta" lo reciben; la
# bodega (canal "production") NO se actualiza hasta que promuevas la versión con
# el workflow "Capgo PROMOVER a producción". Así una versión rota nunca llega de
# golpe a todos los equipos.
#
# ÚNICO requisito de configuración: agregar el secreto de repositorio CAPGO_TOKEN
# (GitHub → Settings → Secrets and variables → Actions → New repository secret).
# Las variables de Supabase van embebidas porque son públicas (ya están en dist/).

on:
  push:
    branches: [main]

concurrency:
  group: capgo-ota
  cancel-in-progress: false

env:
  CAPGO_CLI_VERSION: 8.25.1

jobs:
  ota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # para comparar la versión con el commit anterior

      - name: ¿Cambió la versión?
        id: ver
        run: |
          NEW=$(node -p "require('./package.json').version")
          git show HEAD~1:package.json > /tmp/old.json 2>/dev/null || echo '{}' > /tmp/old.json
          OLD=$(node -p "(require('/tmp/old.json').version)||''")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then echo "changed=yes" >> "$GITHUB_OUTPUT"; else echo "changed=no" >> "$GITHUB_OUTPUT"; fi
          echo "Versión: '$OLD' -> '$NEW'"

      - name: Setup Node
        if: steps.ver.outputs.changed == 'yes'
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0 # npm ci pasa estable con Node 24 / npm 11 en este repo
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Mostrar versión de Node/NPM
        if: steps.ver.outputs.changed == 'yes'
        run: |
          node -v
          npm -v

      - name: Instalar dependencias
        if: steps.ver.outputs.changed == 'yes'
        run: npm ci

      - name: Build web (con Supabase)
        if: steps.ver.outputs.changed == 'yes'
        env:
          # Públicas: URL + clave anónima, administrada como secreto de Actions.
          VITE_SUPABASE_URL: https://vtrtyzbgpsvqwbfoudaf.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Subir bundle a Capgo (canal BETA)
        if: steps.ver.outputs.changed == 'yes' && steps.ver.outputs.new == '1.55.145'
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "::warning::Falta el secreto CAPGO_TOKEN — se omite la subida OTA. Agrégalo en Settings → Secrets → Actions."
            exit 0
          fi
          npx -y @capgo/cli@${CAPGO_CLI_VERSION} bundle upload com.cco.wms \
            --apikey "$CAPGO_TOKEN" \
            --path ./dist \
            --channel beta \
            --bundle "${{ steps.ver.outputs.new }}" \
            --version-exists-ok \
            --comment "GitHub Actions ${GITHUB_SHA}"
          echo "::notice::Puente 1.55.145 subido a Capgo BETA. Es la última versión que usa Capgo Cloud."

      - name: Sin cambio de versión
        if: steps.ver.outputs.changed != 'yes'
        run: echo "La versión de package.json no cambió; no se sube OTA (Capgo rechaza versiones duplicadas)."
