# CCO PTM Edge Function policy.
# Database webhooks must be configured with "Add auth header with service key".
[functions.notify-ticket]
verify_jwt = true

[functions.notify-ticket-update]
verify_jwt = true

# Calculadora vial privada; además del JWT valida el UID propietario.
[functions.coord-route-distance]
verify_jwt = true

# Endpoint publico con autenticacion propia: token aleatorio SHA-256, segundo
# token de consulta, rate-limit, honeypot, CORS estricto y bucket privado.
[functions.rendiciones-publicas]
verify_jwt = false

# Protocolo nativo del actualizador: se invoca antes del inicio de sesión.
# La función valida app_id/device_id/canal, limita payloads y solo devuelve
# URLs inmutables del repositorio oficial con checksum SHA-256.
[functions.ota-updates]
verify_jwt = false

[functions.ota-deploy]
verify_jwt = true

# GitHub Actions usa un token dedicado validado dentro de la función.
[functions.ota-publish]
verify_jwt = false
